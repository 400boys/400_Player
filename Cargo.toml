[workspace]
resolver = "3"
members = [
    "crates/400_media_player-core",
    "crates/400_media_player-engine",
    "crates/400_media_player",
    "crates/rmedia-util",
    "crates/rmedia-codec",
    "crates/rmedia-swscale",
    "crates/rmedia-swresample",
    "crates/rmedia-format",
    "crates/rmedia-filter",
    "crates/rmedia-device",
    "crates/rmedia-tools",
    "crates/rmedia",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["400_media_player contributors"]
description = "400_media_player — a modern, 100% standalone pure-Rust GPU-accelerated media player powered by Rmedia."
keywords = ["media-player", "video", "audio", "pure-rust", "wgpu", "rmedia"]
categories = ["multimedia::video", "multimedia::audio"]

[workspace.lints.rust]
unsafe_code = "allow"
unused_imports = "allow"
unused_variables = "allow"
dead_code = "allow"
unused_mut = "allow"

[workspace.lints.clippy]
too_many_arguments = "allow"
needless_range_loop = "allow"
manual_swap = "allow"
chunks_exact_to_as_chunks = "allow"
manual_is_multiple_of = "allow"
manual_div_ceil = "allow"
field_reassign_with_default = "allow"
suspicious_arithmetic_impl = "allow"
manual_flatten = "allow"
inconsistent_digit_grouping = "allow"
collapsible_if = "allow"
if_same_then_else = "allow"
manual_range_contains = "allow"
derivable_impls = "allow"
unnecessary_min_or_max = "allow"

[workspace.dependencies]
media_player_400-core = { path = "crates/400_media_player-core" }
media_player_400-engine = { path = "crates/400_media_player-engine" }

rmedia = { path = "crates/rmedia" }
rmedia-util = { path = "crates/rmedia-util" }
rmedia-codec = { path = "crates/rmedia-codec" }
rmedia-swscale = { path = "crates/rmedia-swscale" }
rmedia-swresample = { path = "crates/rmedia-swresample" }
rmedia-format = { path = "crates/rmedia-format" }
rmedia-filter = { path = "crates/rmedia-filter" }
rmedia-device = { path = "crates/rmedia-device" }
rmedia-tools = { path = "crates/rmedia-tools" }

anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
parking_lot = "0.12"
crossbeam-channel = "0.5"
rtrb = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
fastrand = "2"
natord = "1"
walkdir = "2"
realfft = "3"
rustfft = "6"
chardetng = "1"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }
eframe = { version = "0.37", default-features = false, features = ["wgpu", "wayland", "x11", "clipboard", "system_fonts"] }
rfd = "0.17"
egui = { version = "0.37", default-features = false }
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.4"
sys-locale = "0.3"
keepawake = "0.6"
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
rust_h264 = "0.6"
rust_h265 = "0.4"
oxideav-core = "0.1"
oxideav-ac3 = "0.0"
oxideav-aac = "0.1"
oxideav-opus = "0.0"
oxideav-vorbis = "0.0"
oxideav-mp1 = "0.0"
oxideav-mp3 = "0.1"
oxideav-mpeg12video = "0.0"
oxideav-mpeg4video = "0.1"
oxideav-prores = "0.1"

# Dependencies are optimised even in dev builds so the UI and the DSP stay usable.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = false

# Quick optimised builds for iteration (cargo build --profile fast).
[profile.fast]
inherits = "release"
lto = "off"
codegen-units = 16
incremental = true
strip = false
debug = "line-tables-only"

[patch.crates-io]
oxideav-aac = { path = "crates/oxideav-aac" }
rust_h264 = { path = "crates/rust_h264" }
