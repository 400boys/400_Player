name: 🐛 Signalement de bug / Bug report
description: Signaler un dysfonctionnement ou une erreur dans 400_Player
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler ce problème pour aider à améliorer 400_Player !
  - type: input
    id: version
    attributes:
      label: Version de 400_Player
      description: Indiquez la version ou le commit utilisé (ex: v0.1.0 ou commit sha).
      placeholder: "0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système d'exploitation / OS
      options:
        - Windows 11
        - Windows 10
        - Linux (Ubuntu/Debian)
        - Linux (Arch/Manjaro)
        - Linux (Fedora)
        - Linux (Autre)
    validations:
      required: true
  - type: input
    id: media_format
    attributes:
      label: Format du fichier multimédia (si applicable)
      description: Exemple: MKV H.264 + AAC, MP4 HEVC 10-bit, FLAC 24-bit...
      placeholder: "MKV H.265 / HEVC 10-bit 4K"
  - type: textarea
    id: description
    attributes:
      label: Description du problème
      description: Expliquez clairement ce qui s'est passé.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: 1. Ouvrir le fichier... 2. Cliquer sur...
      placeholder: |
        1. Lancer 400_Player
        2. Ouvrir le fichier ...
        3. Constater le comportement ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devriez-vous observer normalement ?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Sortie console
      description: Collez ici les logs de la console (lancement avec RUST_LOG=debug).
      render: shell
